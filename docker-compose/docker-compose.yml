# OPI-LC: the BRC-20 light client and the OPI API, both run by opi-indexer
# (bestinslot-xyz/OPI). The light client follows the OPI network's verified
# block data, so there is no bitcoind. Run from this directory:
#
#   docker compose up -d --build --remove-orphans
#
# The project name and the volume names match the earlier three-image setup,
# so an existing host keeps its database and BRC2.0 engine data.

name: opi-lc

x-opi-build: &opi-build
  # The OPI repository at OPI_REF (a branch or a release tag).
  context: https://github.com/bestinslot-xyz/OPI.git#${OPI_REF:-opi-monolith}

x-opi-env: &opi-env
  NETWORK_TYPE: ${NETWORK_TYPE:-${BITCOIN_RPC_NETWORK:-mainnet}}
  OPERATION_MODE: light
  # Light mode answers the engine's Bitcoin lookups from the cache alone.
  BITCOIN_RPC_CACHE_ENABLED: "true"
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWD: ${DB_PASSWD:?DB_PASSWD must be set in .env}
  DB_DATABASE: ${DB_DATABASE:-postgres}
  DB_SSL: "false"
  BRC20_PROG_DB_PATH: /data/brc20-prog

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWD:?DB_PASSWD must be set in .env}
      POSTGRES_DB: ${DB_DATABASE:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # opi-indexer runs as uid 10001. An engine volume written by the earlier
  # brc20-prog image belongs to root, so this hands it over once.
  engine-owner:
    image: opi-indexer:lc
    build: *opi-build
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - '[ "$$(stat -c %u /data/brc20-prog)" = 10001 ] || chown -R 10001:10001 /data/brc20-prog'
    volumes:
      - brc20_prog_data:/data/brc20-prog
    restart: "no"

  light:
    image: opi-indexer:lc
    build: *opi-build
    command: ["brc20", "light"]
    env_file: .env
    environment:
      <<: *opi-env
      # Skips the per-block timing rows, which keeps the database smaller.
      SAVE_LOGS: "false"
      # The engine's public JSON-RPC (eth_call, traces). It takes no
      # credentials, so it is published on the host's loopback only.
      BRC20_PROG_RPC_SERVER_URL: 0.0.0.0:18545
    ports:
      - "127.0.0.1:18545:18545"
    volumes:
      - brc20_prog_data:/data/brc20-prog
    depends_on:
      db:
        condition: service_healthy
      engine-owner:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    # The light client finishes its current block on SIGTERM.
    stop_grace_period: 3m

  api:
    image: opi-indexer:lc
    build: *opi-build
    command: ["api"]
    env_file: .env
    environment:
      <<: *opi-env
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  db_data:
  brc20_prog_data:
